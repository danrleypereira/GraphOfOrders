version: '3.8'

# Shared Database Infrastructure
# Deploy this first to establish the database layer
services:
  postgres:
    image: postgres:16-alpine
    container_name: graphoforders-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-ordersdb}
      PGDATA: /data/postgres
    volumes:
      - postgres-data:/data/postgres
      - ./init-databases.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    ports:
      - "5432:5432"
    networks:
      - shared-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

networks:
  shared-network:
    name: graphoforders-shared
    driver: bridge
    external: false

volumes:
  postgres-data:
    driver: local
